name: Build patched Via-derived source

on:
  workflow_dispatch:
    inputs:
      source_archive_url:
        description: 'HTTPS URL to the patched source ZIP (must be accessible to GitHub Actions)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java and Android build tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build tools
        uses: android-actions/setup-android@v3

      - name: Install apktool
        shell: bash
        run: |
          set -euo pipefail
          APKTOOL_VERSION="2.10.0"
          curl -fL "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" -o apktool.jar
          printf '#!/usr/bin/env sh\nexec java -jar "%s/apktool.jar" "$@"\n' "$PWD" > apktool
          chmod +x apktool
          ./apktool --version

      - name: Download and unpack patched source archive
        env:
          SOURCE_ARCHIVE_URL: ${{ inputs.source_archive_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ARCHIVE_URL" -o patched-source.zip
          mkdir source
          unzip -q patched-source.zip -d source
          test -f source/AndroidManifest.xml
          test -f source/apktool.json

      - name: Rebuild APK
        run: |
          set -euo pipefail
          ./apktool b source -o Saifer-debug-unsigned.apk

      - name: Verify output and publish unsigned build for inspection
        run: |
          set -euo pipefail
          test -s Saifer-debug-unsigned.apk
          file Saifer-debug-unsigned.apk
          sha256sum Saifer-debug-unsigned.apk

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saifer-debug-unsigned
          path: Saifer-debug-unsigned.apk
          if-no-files-found: error
          retention-days: 7
